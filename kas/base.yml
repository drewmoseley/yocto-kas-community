# Settings shared by every release. Release files include this and pin branches.
header:
  version: 14

# MACHINE is overridden per target with the KAS_MACHINE environment variable.
machine: qemux86-64
distro: nodistro
target: core-image-full-cmdline

# Host-specific cache locations come from the environment (see local.env.example);
# nothing host-specific is committed here.
env:
  DL_DIR: ""
  SSTATE_DIR: ""
  # Always exported by build.sh. Empty here means: when running kas directly,
  # set both yourself (empty values reach bitbake as empty).
  BB_NUMBER_THREADS: ""
  PARALLEL_MAKE: ""

# sstate is shared across builds, so the hash equivalence database must be shared
# too (otherwise BitBake warns and sstate reuse suffers).
local_conf_header:
  hashserv: |
    BB_HASHSERVE_DB_DIR = "${SSTATE_DIR}"

repos:
  this:
    layers:
      .: disabled

  bitbake:
    url: https://git.openembedded.org/bitbake
    layers:
      .: disabled

  openembedded-core:
    url: https://git.openembedded.org/openembedded-core
    layers:
      meta:

  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    layers:
      meta-oe:
